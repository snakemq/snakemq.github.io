<meta name="description" content="最近在乘地铁上班的路上，偶尔在 Kindle 上阅读《政治的人生》。作者的姓名隐去不谈，因其已经官居高位，且这本著作也已绝版。这本书不是主要讲政治，而是作者自己的随笔，或者说日记。我阅读下来，感触很大，很喜欢作者这种随意而又真实的行文风格。于是萌发效仿的想法，找个偏僻的角落，记录点日常所思所想，供自己日后翻阅。说不定能在平静如水的人生行程中，激起一点点的涟漪。">

  <div class="post-content"><p>最近在乘地铁上班的路上，偶尔在 Kindle 上阅读《政治的人生》。作者的姓名隐去不谈，因其已经官居高位，且这本著作也已绝版。这本书不是主要讲政治，而是作者自己的随笔，或者说日记。我阅读下来，感触很大，很喜欢作者这种随意而又真实的行文风格。于是萌发效仿的想法，找个偏僻的角落，记录点日常所思所想，供自己日后翻阅。说不定能在平静如水的人生行程中，激起一点点的涟漪。</p>
